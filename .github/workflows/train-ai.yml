name: Train Options AI

on:
  workflow_dispatch:
  push:
    paths:
      - "app/environment/**"
      - "app/training.py"
      - "app/data.py"
      - "train_ai.py"
      - "requirements-rl.txt"
      - ".github/workflows/train-ai.yml"

jobs:
  train:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: python -m pip install --upgrade pip && pip install -r requirements-rl.txt

      - name: Train PPO agent
        run: python train_ai.py --ticker SPY --timesteps 5000000

      - name: Upload trained model and evaluation logs
        uses: actions/upload-artifact@v4
        with:
          name: ppo-options-spy
          path: |
            models/ppo_options_spy.zip
            models/best/best_model.zip
            training_eval/
          if-no-files-found: error
